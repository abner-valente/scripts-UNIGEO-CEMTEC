# Roda os testes automaticamente no GitHub a cada push e a cada pull request para a main.
# Os testes usam a API do INMET simulada: não precisam de token nem de segredos.
name: Testes

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:  # permite rodar manualmente pela aba Actions

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true  # um push novo cancela a execução anterior da mesma branch

jobs:
  testes:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Só a versão que a equipe usa. O 3.10 saiu em 01/10/2026: ninguém roda nele, e era
        # o único em que o teste de requisitos acusava um falso positivo. A matriz fica para
        # que pôr uma versão de volta seja acrescentar um item.
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Rodar os testes
        run: python -m pytest
